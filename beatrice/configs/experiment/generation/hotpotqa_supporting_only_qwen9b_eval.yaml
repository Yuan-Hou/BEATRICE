  save_every: 100
  resume: true
output:
  result_path: data/generations/hotpotqa_supporting_only_qwen3_5_9b_results.jsonl
  regression_path: data/regression/hotpotqa_supporting_only_qwen3_5_9b_regressions.jsonl
sample_scope:
  ids_path: configs/sampling/fixed_scope_ids.json
