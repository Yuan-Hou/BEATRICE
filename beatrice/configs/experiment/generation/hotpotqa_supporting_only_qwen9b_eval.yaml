experiment_name: hotpotqa_supporting_only_qwen9b_eval
dataset_path: data/processed/hotpotqa_supporting_only_all_splits.jsonl
model:
  name: Qwen/Qwen3.5-9B
  backend: openai_compatible
  api_key: EMPTY
  base_url: http://localhost:2333/v1
  enable_thinking: false
judge_model:
  name: Qwen/Qwen3.5-27B
  backend: openai_compatible
  api_key: EMPTY
  base_url: http://localhost:2334/v1
