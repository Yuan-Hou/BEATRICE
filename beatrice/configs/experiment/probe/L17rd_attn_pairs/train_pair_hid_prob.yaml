experiment_name: train_qa_resnet_pair_hid_prob_noctx_L17rd_attn
model_name: Qwen/Qwen3.5-9B
gpu_id: '3'
data:
  train_meta_paths:
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/musique_question_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/hotpotqa_supporting_only_question_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/twowiki_supporting_only_question_features_meta.jsonl
  validation_meta_paths:
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/musique_question_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/hotpotqa_supporting_only_question_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_question_L17_rd/twowiki_supporting_only_question_features_meta.jsonl
  train_splits:
  - train
  validation_splits:
  - validation
  judge_consensus_purified: true
  purification_summary_path: data/features_judge_consensus/purification_summary.json
  validation_partition:
    enabled: true
    source_splits:
    - validation
    ids_path: configs/sampling/fixed_scope_ids.json
    group: validation
    name: fixed_validation
  train_partition:
    enabled: true
    source_splits:
    - train
    ids_path: configs/sampling/fixed_scope_ids.json
    group: train
    name: fixed_train
probe:
  architecture: question_answer_resnet
  batch_size: 512
  epochs: 80
  learning_rate: 1.0e-05
  weight_decay: 0.01
  num_workers: 0
  hidden_dim: 128
  embed_proj_dim: 32
  num_res_blocks: 3
  question_max_len: 128
  answer_max_len: 32
  positive_transition: NY
  label_mode: without_context_correct
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5
  min_learning_rate: 1.0e-07
  early_stopping_patience: 16
  early_stopping_min_delta: 0.0001
  noise_std: 0.02
  dropout: 0.1
  hidden_proj_dim: 32
  pin_memory: false
  show_progress: true
  torch_num_threads: 4
  torch_num_interop_threads: 1
  use_last_hidden: true
  use_numeric_features: true
  use_probability_features: true
  use_residual_features: false
  use_attention_features: false
  use_token_embedding: false
  use_attention_mass: true
output:
  checkpoint_path: outputs/L17rd_attn_pairs_probes/hid_prob/question_checkpoint.pth
  val_prediction_path: outputs/L17rd_attn_pairs_probes/hid_prob/question_val_preds.jsonl
