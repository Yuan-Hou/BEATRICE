experiment_name: train_cqa_frozen_fusion_withctx_ctxL17rd_attn_singles4_pairs6
model_name: Qwen/Qwen3.5-9B
gpu_id: '4'
data:
  train_meta_paths:
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/musique_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/hotpotqa_supporting_only_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/twowiki_supporting_only_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_rewritten_context_L17_rd/rewritten_context_cqa_features_meta.jsonl
  validation_meta_paths:
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/musique_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/hotpotqa_supporting_only_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_L17_rd/twowiki_supporting_only_features_meta.jsonl
  - data/features_judge_consensus/qwen3_5_9b_rewritten_context_L17_rd/rewritten_context_cqa_features_meta.jsonl
  rag_class_meta_paths: []
  train_splits:
  - train
  validation_splits:
  - validation
  judge_consensus_purified: true
  purification_summary_path: data/features_judge_consensus/purification_summary.json
  validation_partition:
    enabled: true
    source_splits:
    - validation
    ids_path: configs/sampling/fixed_scope_ids.json
    group: validation
    name: fixed_validation
  train_partition:
    enabled: true
    source_splits:
    - train
    ids_path: configs/sampling/fixed_scope_ids.json
    group: train
    name: fixed_train
probe:
  architecture: context_question_answer_frozen_encoder_fusion
  max_context_len: 2048
  context_max_len: 2048
  question_max_len: 128
  answer_max_len: 32
  embed_proj_dim: 32
  num_res_blocks: 3
  batch_size: 64
  epochs: 60
  learning_rate: 0.0002
  weight_decay: 0.01
  num_workers: 0
  hidden_dim: 128
  positive_transition: NY
  label_mode: with_context_correct
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 4
  min_learning_rate: 1.0e-07
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001
  dropout: 0.15
  hidden_proj_dim: 32
  pin_memory: false
  show_progress: true
  torch_num_threads: 4
  torch_num_interop_threads: 1
  use_token_embedding: false
  use_last_hidden: true
  modality_dropout: 0.3
  fusion_hidden_dim: 128
  branch_checkpoints:
  - name: hidden
    checkpoint_path: outputs/ctx_L17rd_attn_probes/only_hidden/context_checkpoint.pth
  - name: probability
    checkpoint_path: outputs/ctx_L17rd_attn_probes/only_probability/context_checkpoint.pth
  - name: residual
    checkpoint_path: outputs/ctx_L17rd_attn_probes/only_residual/context_checkpoint.pth
  - name: attention
    checkpoint_path: outputs/ctx_L17rd_attn_probes/only_attention/context_checkpoint.pth
  - name: hid_prob
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/hid_prob/context_checkpoint.pth
  - name: hid_resid
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/hid_resid/context_checkpoint.pth
  - name: hid_attn
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/hid_attn/context_checkpoint.pth
  - name: prob_resid
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/prob_resid/context_checkpoint.pth
  - name: prob_attn
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/prob_attn/context_checkpoint.pth
  - name: resid_attn
    checkpoint_path: outputs/ctx_L17rd_attn_pairs_probes/resid_attn/context_checkpoint.pth
  use_attention_mass: true
output:
  checkpoint_path: outputs/checkpoints/frozen_fusion_context_question_answer_withctx_ctxL17rd_attn_singles4_pairs6.pth
  val_prediction_path: outputs/predictions/frozen_fusion_context_withctx_ctxL17rd_attn_singles4_pairs6_val.jsonl
report:
  train_log_path: outputs/training_runs/latest/train.log
  threshold: 0.5
  ood_prediction_paths:
  - outputs/predictions/popqa_probe_preds.jsonl
  triage_metrics_paths:
  - outputs/predictions/musique_probe_triage_metrics.json
