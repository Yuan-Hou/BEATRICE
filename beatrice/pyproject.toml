[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragprobe"
version = "0.1.0"
description = "Research framework for RAG internal probing and dataset-level RAG evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
